<app-auth-card [loading]="loading()">

  <!-- Back to Login Link -->
  <div class="mb-6 flex justify-start">
    <a (click)="navigateToSignIn()"
      class="flex items-center gap-2 text-[14px] font-extrabold text-slate-500 hover:text-emerald-600 transition-all duration-200 cursor-pointer group">
      <svg class="w-5 h-5 flex-shrink-0 transition-transform group-hover:-translate-x-0.5 duration-200" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span>Quay Lại Đăng Nhập</span>
    </a>
  </div>

  <!-- Header Title -->
  <div class="flex flex-col items-center text-center mb-8">
    <h2 class="text-3xl font-black text-emerald-600 tracking-tight uppercase font-sports-display mb-2">Đặt lại mật khẩu</h2>
    <p class="text-[14px] font-bold text-slate-500 font-sports-body">Nhập email của bạn để khôi phục mật khẩu</p>
  </div>

  <!-- Form Content -->
  <div class="space-y-6 font-sports-body">
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmitStep1()" class="space-y-5">

      <!-- Email Field -->
      <app-form-field
        label="Email"
        icon="mail"
        [showError]="!!(forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid)"
        errorMessage="Email chưa đúng">
        <input type="email" formControlName="email" required autocomplete="email"
          [class.border-rose-355]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
          class="w-full pl-11.5 pr-4 py-3.5 rounded-2xl border border-slate-300 bg-white/60 backdrop-blur-md focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/5 focus:border-emerald-500 text-[15px] font-bold text-slate-900 placeholder-slate-500 transition-all duration-300 hover:border-slate-400"
          placeholder="you@example.com">
      </app-form-field>

      <!-- Password Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Password Field -->
        <app-password-input
          formControlName="password"
          label="Mật khẩu mới"
          placeholder="••••••••••••••••"
          autocomplete="new-password"
          [showError]="passwordHasError()"
          errorMessage=""
          errorId="forgot-password-validation-errors"
          errorClass="border-rose-355"
        />

        <!-- Confirm Password Field -->
        <app-password-input
          formControlName="confirmPassword"
          label="Xác nhận mật khẩu"
          placeholder="••••••••••••••••"
          autocomplete="new-password"
          [showError]="confirmPasswordHasError()"
          errorMessage=""
          errorId="forgot-password-validation-errors"
          errorClass="border-rose-355"
        />
      </div>

      <app-password-strength
        [password]="forgotForm.get('password')?.value ?? ''"
        [errors]="passwordValidationErrors()"
        errorId="forgot-password-validation-errors"
      />

      <!-- Action Button -->
      <app-submit-button
        label="Đặt Lại Mật Khẩu"
        loadingLabel="Đang xử lý..."
        [loading]="loading()"
        [disabled]="forgotForm.invalid"
      />

    </form>
  </div>

</app-auth-card>
