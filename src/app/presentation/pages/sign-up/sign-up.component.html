<app-auth-card [loading]="loading()">

  <!-- Header Title -->
  <div class="flex flex-col items-center text-center mb-8">
    <h2 class="text-3xl font-black text-emerald-600 tracking-tight uppercase font-sports-display mb-2">Đăng Ký</h2>
    <p class="text-[14px] font-bold text-slate-500 font-sports-body">Tạo tài khoản mới để tham gia cùng đồng đội</p>
  </div>

  <!-- Form Content -->
  <div class="space-y-6 font-sports-body">
    <form [formGroup]="signUpForm" (ngSubmit)="register()" class="space-y-5">

      <!-- Full Name Field -->
      <app-form-field
        label="Họ và Tên"
        icon="user"
        [showError]="!!(signUpForm.get('fullName')?.touched && signUpForm.get('fullName')?.invalid)"
        errorMessage="Bắt buộc">
        <input type="text" formControlName="fullName" required autocomplete="name"
          [class.border-rose-350]="signUpForm.get('fullName')?.touched && signUpForm.get('fullName')?.invalid"
          class="w-full pl-11.5 pr-4 py-3.5 rounded-2xl border border-slate-300 bg-white/60 backdrop-blur-md focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/5 focus:border-emerald-500 text-[15px] font-bold text-slate-900 placeholder-slate-500 transition-all duration-300 hover:border-slate-400"
          placeholder="Họ và tên của bạn">
      </app-form-field>

      <!-- Username Field -->
      <app-form-field
        label="Tên đăng nhập"
        icon="user-check"
        [showError]="!!(signUpForm.get('username')?.touched && signUpForm.get('username')?.invalid)"
        errorMessage="Tối thiểu 3 ký tự">
        <input type="text" formControlName="username" required autocomplete="username"
          [class.border-rose-350]="signUpForm.get('username')?.touched && signUpForm.get('username')?.invalid"
          class="w-full pl-11.5 pr-4 py-3.5 rounded-2xl border border-slate-300 bg-white/60 backdrop-blur-md focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/5 focus:border-emerald-500 text-[15px] font-bold text-slate-900 placeholder-slate-500 transition-all duration-300 hover:border-slate-400"
          placeholder="Tên đăng nhập">
      </app-form-field>

      <!-- Email Field -->
      <app-form-field
        label="Email"
        icon="mail"
        [showError]="!!(signUpForm.get('email')?.touched && signUpForm.get('email')?.invalid)"
        errorMessage="Email chưa đúng">
        <input type="email" formControlName="email" required autocomplete="email"
          [class.border-rose-350]="signUpForm.get('email')?.touched && signUpForm.get('email')?.invalid"
          class="w-full pl-11.5 pr-4 py-3.5 rounded-2xl border border-slate-300 bg-white/60 backdrop-blur-md focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/5 focus:border-emerald-500 text-[15px] font-bold text-slate-900 placeholder-slate-500 transition-all duration-300 hover:border-slate-400"
          placeholder="example@gmail.com">
      </app-form-field>

      <!-- Password Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Password Field -->
        <app-password-input
          formControlName="password"
          label="Mật khẩu"
          placeholder="••••••••••••••••"
          autocomplete="new-password"
          [showError]="!!(signUpForm.get('password')?.touched && signUpForm.get('password')?.invalid)"
          errorMessage="Yếu"
          errorClass="border-rose-355"
        />

        <!-- Confirm Password Field -->
        <app-password-input
          formControlName="confirmPassword"
          label="Xác nhận mật khẩu"
          placeholder="••••••••••••••••"
          autocomplete="new-password"
          [showError]="!!(signUpForm.get('confirmPassword')?.touched && signUpForm.get('confirmPassword')?.invalid)"
          errorMessage="Không khớp"
          errorClass="border-rose-350"
        />
      </div>

      <!-- Password Strength Meter — Full width, outside the grid -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center text-[12px]">
          <span class="text-slate-500 font-extrabold uppercase tracking-wider font-sports-display">Độ mạnh mật khẩu</span>
          <span class="font-extrabold font-sports-display uppercase tracking-wider text-[10px]" [class]="passwordStrength() === 0 ? 'text-slate-500' :
                         passwordStrength() === 1 ? 'text-rose-600 font-black' :
                         passwordStrength() === 2 ? 'text-amber-600 font-black' :
                         passwordStrength() === 3 ? 'text-yellow-600 font-black' :
                         'text-emerald-600 font-black'">
            {{ passwordStrength() === 0 ? '' :
            passwordStrength() === 1 ? 'Yếu' :
            passwordStrength() === 2 ? 'Vừa' :
            passwordStrength() === 3 ? 'Mạnh' : 'Tuyệt vời' }}
          </span>
        </div>
        <div class="grid grid-cols-4 gap-1.5 h-1.5 w-full bg-slate-200/60 rounded-full overflow-hidden">
          <div class="h-full rounded-full transition-all duration-300"
            [class]="passwordStrength() >= 1 ? (passwordStrength() === 1 ? 'bg-rose-500' : passwordStrength() === 2 ? 'bg-amber-500' : passwordStrength() === 3 ? 'bg-yellow-500' : 'bg-emerald-500') : 'bg-transparent'">
          </div>
          <div class="h-full rounded-full transition-all duration-300"
            [class]="passwordStrength() >= 2 ? (passwordStrength() === 2 ? 'bg-amber-500' : passwordStrength() === 3 ? 'bg-yellow-500' : 'bg-emerald-500') : 'bg-transparent'">
          </div>
          <div class="h-full rounded-full transition-all duration-300"
            [class]="passwordStrength() >= 3 ? (passwordStrength() === 3 ? 'bg-yellow-500' : 'bg-emerald-500') : 'bg-transparent'">
          </div>
          <div class="h-full rounded-full transition-all duration-300"
            [class]="passwordStrength() >= 4 ? 'bg-emerald-500' : 'bg-transparent'"></div>
        </div>
      </div>

      <!-- Action Button -->
      <app-submit-button
        label="Đăng Ký"
        loadingLabel="Đang tạo tài khoản..."
        [loading]="loading()"
        [disabled]="signUpForm.invalid"
      />

    </form>
  </div>

  <!-- Card Footer -->
  <div class="mt-8 pt-6 border-t border-slate-200 text-center font-sports-body">
    <p class="text-[14px] font-bold text-slate-500">
      Đã có tài khoản? <a (click)="navigateToSignIn()"
        class="font-extrabold text-emerald-600 hover:text-emerald-700 hover:underline cursor-pointer transition-colors">Đăng nhập</a>
    </p>
  </div>

</app-auth-card>
