<app-auth-card [loading]="loading()">

  <!-- Header Title -->
  <div class="flex flex-col items-center text-center mb-8">
    <h2 class="text-3xl font-black text-emerald-600 tracking-tight uppercase font-sports-display mb-2">Nhập mã xác thực</h2>
    <p class="text-[14px] font-bold text-slate-500 font-sports-body">Chúng tôi đã gửi mã 6 chữ số đến email của bạn.</p>
  </div>

  <!-- Form Content -->
  <div class="space-y-6 font-sports-body">
    <form [formGroup]="verifyForm" (ngSubmit)="verify()" class="space-y-5 flex flex-col items-center">

      <!-- Email Field (Read only style) -->
      <app-form-field
        label="Email nhận mã"
        icon="mail">
        <input type="email" formControlName="email" readonly
          class="w-full pl-11.5 pr-4 py-3.5 rounded-2xl border border-slate-300 bg-slate-100 text-slate-500 font-bold text-[15px] focus:outline-none cursor-not-allowed shadow-inner"
          placeholder="example@gmail.com">
      </app-form-field>

      <!-- OTP Label and inputs -->
      <div class="w-full text-left space-y-2.5">
        <label class="block text-[13px] font-extrabold uppercase tracking-wide text-slate-700 font-sports-display">Mã xác thực OTP</label>
        <div class="flex justify-between gap-2.5 my-1 w-full">
          @for (digit of [0, 1, 2, 3, 4, 5]; track $index) {
          <input type="text" maxlength="1"
            class="w-11 h-11 sm:w-13 sm:h-13 text-center font-black text-xl text-slate-900 border border-slate-300 bg-white/60 backdrop-blur-md focus:bg-white rounded-2xl focus:outline-none focus:ring-4 focus:ring-emerald-500/5 focus:border-emerald-500 transition-all duration-300 hover:border-slate-400"
            [value]="otp()[$index]" (input)="onOtpInput($event, $index)" (keydown)="onOtpKeyDown($event, $index)"
            pattern="\d*">
          }
        </div>
      </div>

      <!-- Submit Button -->
      <app-submit-button
        label="Xác Thực"
        loadingLabel="Đang xác thực..."
        [loading]="loading()"
        [disabled]="!isOtpComplete()"
      />

      <!-- Countdown / Resend -->
      <p class="text-[14px] font-bold text-slate-500 mt-4 text-center">
        Không nhận được mã?
        @if (countdown() > 0) {
        <span class="text-slate-500 font-bold">Gửi lại sau <strong class="text-slate-700 font-extrabold ml-1">{{ countdown() }}s</strong></span>
        } @else {
        <a (click)="resendCode()"
          class="font-extrabold text-emerald-600 hover:underline cursor-pointer transition-colors duration-200 animate-pulse">Gửi Lại Mã</a>
        }
      </p>

    </form>
  </div>

  <!-- Card Footer -->
  <div class="mt-8 pt-6 border-t border-slate-200 text-center font-sports-body">
    <p class="text-[14px] font-bold text-slate-500">
      Quay lại trang <a (click)="navigateToSignIn()"
        class="font-extrabold text-emerald-600 hover:text-emerald-700 hover:underline cursor-pointer transition-colors">Đăng nhập</a>
    </p>
  </div>

</app-auth-card>
