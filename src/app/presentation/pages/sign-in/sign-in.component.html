<app-auth-card [loading]="loading()">

  <!-- Header Title -->
  <div class="flex flex-col items-center text-center mb-8">
    <h2 class="text-3xl font-black text-emerald-600 tracking-tight uppercase font-sports-display mb-2">Đăng Nhập</h2>
    <p class="text-[14px] font-bold text-slate-500 font-sports-body">Kết nối cộng đồng thể thao và đặt sân nhanh chóng
    </p>
  </div>

  <!-- Content Section -->
  <div class="space-y-6 font-sports-body">

    <!-- Social Sign-in — Google only -->
    <div>
      <button type="button" (click)="loginWithGoogle()"
        class="w-full py-3.5 px-4 rounded-2xl border border-slate-300 bg-white/90 backdrop-blur-md hover:bg-slate-50 transition-all duration-200 flex items-center justify-center gap-2.5 font-extrabold text-[16px] tracking-wide text-slate-800 focus:outline-none cursor-pointer">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
          <path
            d="M21.35,11.1H12v2.7h5.38c-0.24,1.28 -0.96,2.37 -2.04,3.1v2.58h3.3c1.93,-1.78 3.04,-4.4 3.04,-7.4C21.68,11.83 21.56,11.41 21.35,11.1z"
            fill="#4285F4" />
          <path
            d="M12,20.6c2.43,0 4.47,-0.8 5.96,-2.18l-3.3,-2.58c-0.9,0.6 -2.07,0.98 -3.3,0.98 -2.34,0 -4.33,-1.58 -5.03,-3.7H2.92v2.66C4.4,18.66 8.0,20.6 12,20.6z"
            fill="#34A853" />
          <path
            d="M6.97,13.12c-0.18,-0.54 -0.28,-1.11 -0.28,-1.7c0,-0.59 0.1,-1.16 0.28,-1.7V7.06H2.92c-0.62,1.24 -0.97,2.64 -0.97,4.12c0,1.48 0.35,2.88 0.97,4.12l4.05,-3.18z"
            fill="#FBBC05" />
          <path
            d="M12,6.18c1.32,0 2.5,0.45 3.44,1.35l2.58,-2.58C16.46,3.46 14.43,2.6 12,2.6c-4.0,0 -7.6,1.94 -9.08,4.46l4.05,3.18c0.7,-2.12 2.69,-3.7 5.03,-3.7z"
            fill="#EA4335" />
        </svg>
        Đăng nhập với Google
      </button>
    </div>

    <!-- Elegant text divider -->
    <div class="flex items-center text-center my-6">
      <div class="flex-1 border-b border-slate-200/60"></div>
      <span class="mx-4 text-[11px] font-extrabold uppercase tracking-widest text-slate-500 font-sports-display">hoặc sử
        dụng email</span>
      <div class="flex-1 border-b border-slate-200/60"></div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5">

      <!-- Username Field -->
      <app-form-field label="Tên đăng nhập / Email" icon="user"
        [showError]="!!(loginForm.get('username')?.touched && loginForm.get('username')?.invalid)"
        errorMessage="Bắt buộc">
        <input type="text" formControlName="username" required autocomplete="username"
          [class.border-rose-350]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
          class="w-full pl-11.5 pr-4 py-3.5 rounded-2xl border border-slate-300 bg-white/60 backdrop-blur-md focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/5 focus:border-emerald-500 text-[15px] font-bold text-slate-900 placeholder-slate-500 transition-all duration-300 hover:border-slate-400"
          placeholder="Username hoặc email">
      </app-form-field>

      <!-- Password Field -->
      <app-password-input formControlName="password" label="Mật khẩu" placeholder="••••••••"
        autocomplete="current-password"
        [showError]="!!(loginForm.get('password')?.touched && loginForm.get('password')?.invalid)"
        errorMessage="Mật khẩu không đúng định dạng" errorClass="border-rose-350" />

      <!-- Forgot Password — right-aligned -->
      <div class="flex justify-end pt-1">
        <a (click)="navigateToForgotPassword()"
          class="text-[14px] font-extrabold text-slate-500 hover:text-emerald-600 hover:underline cursor-pointer transition-all duration-200">Quên
          mật khẩu?</a>
      </div>

      <!-- Submit Button -->
      <app-submit-button label="Đăng Nhập" loadingLabel="Đang đăng nhập..." [loading]="loading()"
        [disabled]="loginForm.invalid" />

    </form>
  </div>

  <!-- Card Footer -->
  <div class="mt-8 pt-6 border-t border-slate-200 text-center font-sports-body">
    <p class="text-[14px] font-bold text-slate-500">
      Chưa có tài khoản? <a (click)="navigateToSignUp()"
        class="font-extrabold text-emerald-600 hover:text-emerald-700 hover:underline cursor-pointer transition-colors">Đăng
        ký ngay</a>
    </p>
  </div>

</app-auth-card>
