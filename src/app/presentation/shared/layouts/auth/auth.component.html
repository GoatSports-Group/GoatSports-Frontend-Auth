<div
  class="h-dvh w-full flex flex-col items-center justify-center bg-slate-50/40 font-sports-body relative px-4 sm:px-8 overflow-hidden">

  <!-- Interactive 3D perspective grid canvas -->
  <canvas id="auth-canvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-80 z-0"></canvas>

  <div class="absolute inset-0 w-full h-full pointer-events-none z-0 flex items-center overflow-hidden">
    <div class="animate-marquee-ltr flex items-center">
      <!-- BỘ ẢNH LẦN 1 -->
      <div class="flex items-center gap-6 sm:gap-10 pr-6 sm:pr-10 flex-shrink-0">
        <img src="assets/images/sports/football.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Football">
        <img src="assets/images/sports/basketball.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Basketball">
        <img src="assets/images/sports/volleyball.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Volleyball">
        <img src="assets/images/sports/badminton.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Badminton">
        <img src="assets/images/sports/tennis.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Tennis">
        <img src="assets/images/sports/table_tennis.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Table Tennis">
      </div>

      <!-- BỘ ẢNH LẦN 2 -->
      <div class="flex items-center gap-6 sm:gap-10 pr-6 sm:pr-10 flex-shrink-0">
        <img src="assets/images/sports/football.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Football">
        <img src="assets/images/sports/basketball.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Basketball">
        <img src="assets/images/sports/volleyball.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Volleyball">
        <img src="assets/images/sports/badminton.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Badminton">
        <img src="assets/images/sports/tennis.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Tennis">
        <img src="assets/images/sports/table_tennis.jpg"
          class="h-44 sm:h-56 w-auto rounded-3xl object-cover contrast-125 shadow-lg" alt="Table Tennis">
      </div>
    </div>
  </div>

  <!-- Clean, soft ambient background details for the form area (enriched colors for glassmorphism refraction) -->
  <div
    class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-emerald-200/25 rounded-full filter blur-[130px] pointer-events-none z-0">
  </div>
  <div
    class="absolute bottom-1/4 left-1/2 -translate-x-1/2 translate-y-1/2 w-[750px] h-[750px] bg-sky-200/25 rounded-full filter blur-[150px] pointer-events-none z-0">
  </div>

  <!-- Centered Branding and Form Card -->
  <div class="w-full max-w-[580px] flex flex-col items-center gap-6 z-10 relative">

    <!-- Centered Brand Logo with high-end athletic tracking -->
    <a (click)="navigateToHome()"
      class="flex items-center gap-3.5 cursor-pointer select-none group transition-all duration-300">
      <img src="assets/images/goat.png" alt="Goat Sports Logo"
        class="h-20 w-full object-contain transition-all duration-500 group-hover:scale-105">
      <span class="font-sports-display font-extrabold text-3xl tracking-[0.2em] uppercase text-slate-800">
        GOAT<span class="text-emerald-600 font-black">SPORTS</span>
      </span>
    </a>

    <!-- Router content wrapper with 3D Card Hover Tilt triggers -->
    <div id="auth-card-wrapper" class="w-full">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
