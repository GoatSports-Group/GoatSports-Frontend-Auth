<div

  <div class="my-auto w-full min-w-0 max-w-[720px] flex flex-col items-center gap-4 sm:gap-6 z-10 relative">

    <a (click)="navigateToHome()"
      class="flex items-center gap-3.5 cursor-pointer select-none group transition-all duration-300">
      <img src="assets/images/goat.png" alt="Goat Sports Logo"
        class="h-14 sm:h-20 w-auto max-w-20 object-contain transition-all duration-500 group-hover:scale-105">
      <span class="font-sports-display font-extrabold text-2xl sm:text-3xl tracking-[0.12em] sm:tracking-[0.2em] uppercase text-slate-800">
        GOAT<span class="text-emerald-600 font-black">SPORTS</span>
      </span>
    </a>

    <div id="auth-card-wrapper" class="w-full min-w-0 max-w-full">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
