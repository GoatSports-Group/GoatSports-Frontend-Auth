<button type="submit" [disabled]="disabled() || loading()"
  class="w-full py-3.5 rounded-2xl font-sports-display font-extrabold text-[15px] tracking-wide uppercase text-white shadow-md shadow-emerald-650/10 bg-emerald-600 hover:bg-emerald-700 hover:shadow-lg hover:shadow-emerald-600/20 transition-all duration-300 active:scale-[0.99] disabled:opacity-50 disabled:pointer-events-none disabled:shadow-none focus:outline-none cursor-pointer">
  @if (loading()) {
  <span class="flex items-center justify-center gap-2">
    <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
      </path>
    </svg>
    <span>{{ loadingLabel() }}</span>
  </span>
  } @else {
  <span>{{ label() }}</span>
  }
</button>
