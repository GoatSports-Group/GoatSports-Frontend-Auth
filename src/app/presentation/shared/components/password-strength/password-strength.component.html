<div class="space-y-2 rounded-2xl bg-slate-50 px-4 py-3" aria-live="polite">
  <div class="flex justify-between text-[11px] font-extrabold uppercase tracking-wider text-slate-600">
    <span>Độ mạnh mật khẩu</span>
    <span>{{ score() }}/4</span>
  </div>

  <div class="grid h-1.5 grid-cols-4 gap-1.5 rounded-full bg-slate-200" aria-hidden="true">
    @for (segment of segments; track segment) {
      <span class="rounded-full transition-colors" [class.bg-emerald-500]="score() >= segment"></span>
    }
  </div>

  <p class="text-[11px] text-slate-600">
    Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.
  </p>

  @if (errors().length > 0) {
    <div [id]="errorId() || null" role="alert" class="space-y-1 text-[12px] font-bold text-rose-600">
      @for (error of errors(); track $index) {
        <p>{{ error }}</p>
      }
    </div>
  }
</div>
