<app-form-field
  [label]="label()"
  [fieldId]="fieldId()"
  [errorId]="errorId()"
  [icon]="'lock'"
  [showError]="showError()"
  [errorMessage]="errorMessage()">
  <input
    [id]="fieldId() || null"
    [type]="hidePassword() ? 'password' : 'text'"
    [value]="value"
    [disabled]="disabled"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [attr.aria-invalid]="showError()"
    [attr.aria-describedby]="showError() && errorId() ? errorId() : null"
    (input)="onInput($event)"
    (blur)="onTouched()"
    [class]="showError() ? errorClass() : ''"
    class="w-full pl-11.5 pr-11 py-3.5 rounded-2xl border border-slate-300 bg-white/60 backdrop-blur-md focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/5 focus:border-emerald-500 text-[15px] font-bold text-slate-900 placeholder-slate-500 transition-all duration-300 hover:border-slate-400">
  
  <button type="button" (click)="togglePasswordVisibility()" [disabled]="disabled"
    [attr.aria-label]="hidePassword() ? 'Hiện mật khẩu' : 'Ẩn mật khẩu'"
    class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-600 transition-colors hover:text-slate-800 focus-visible:outline-none focus-visible:text-emerald-700 disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer">
    @if (hidePassword()) {
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
    </svg>
    } @else {
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    </svg>
    }
  </button>
</app-form-field>
