<div
  class="w-full bg-white/75 backdrop-blur-xl border border-white/60 shadow-[0_24px_60px_rgba(15,23,42,0.04)] rounded-[28px] p-4 sm:p-6 relative overflow-hidden max-sm:border-0 max-sm:shadow-none max-sm:bg-transparent max-sm:p-2">

  <!-- Sweep Loading Bar -->
  @if (loading()) {
  <div
    class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-500 bg-[length:200%_100%] animate-[loadingBarSweep_1.5s_linear_infinite]">
  </div>
  }

  <ng-content></ng-content>
</div>
